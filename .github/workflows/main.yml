name: Build postmarketOS recovery ZIP for Samsung Galaxy S7 (herolte)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install pmbootstrap
        run: |
          sudo apt-get update
          sudo apt-get install -y git python3-pip openssl
          pip install pmbootstrap

      - name: Configure pmbootstrap
        run: |
          pmbootstrap init \
            --work /home/runner/pmos_work \
            --command-line \
            --vendor samsung \
            --device herolte \
            --ui gnome-mobile \
            --timezone Asia/Seoul \
            --build-pkgs-on-install false

      - name: Build Android Recovery ZIP
        run: |
          # 비버전 설정 및 유저 패스워드 자동 입력 우회 빌드
          echo -e "eunwoo\neunwoo" | pmbootstrap install --android-recovery-zip --password eunwoo

      - name: Find and Prepare Output File
        run: |
          mkdir -p output
          find /home/runner/pmos_work/chroot_native/tmp -name "*.zip" -exec cp {} output/ \; 2>/dev/null || true
          find /home/runner/pmos_work -name "*herolte*.zip" -exec cp {} output/ \; 2>/dev/null || true
          ls -la output/

      - name: Upload Recovery ZIP Artifact
        uses: actions/upload-artifact@v4
        with:
          name: pmos-samsung-herolte-recovery-zip
          path: output/*.zip
