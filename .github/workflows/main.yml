name: Build postmarketOS recovery ZIP for Samsung Galaxy S7 (herolte)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install pmbootstrap from source
        run: |
          sudo apt-get update
          sudo apt-get install -y git python3-pip python3-setuptools openssl
          git clone https://gitlab.postmarketos.org/postmarketOS/pmbootstrap.git
          cd pmbootstrap
          sudo pip install . --break-system-packages || sudo python3 setup.py install
          pmbootstrap --version

      - name: Configure pmbootstrap
        run: |
          yes "" | pmbootstrap -w /home/runner/pmos_work init
          pmbootstrap -w /home/runner/pmos_work config device samsung-herolte
          pmbootstrap -w /home/runner/pmos_work config ui gnome-mobile

      - name: Build Android Recovery ZIP
        run: |
          echo -e "eunwoo\neunwoo" | pmbootstrap -w /home/runner/pmos_work install --android-recovery-zip --password eunwoo

      - name: Find and Prepare Output File
        run: |
          mkdir -p output
          find /home/runner/pmos_work -name "*.zip" -exec cp {} output/ \; 2>/dev/null || true
          ls -la output/

      - name: Upload Recovery ZIP Artifact
        uses: actions/upload-artifact@v4
        with:
          name: pmos-samsung-herolte-recovery-zip
          path: output/*.zip
